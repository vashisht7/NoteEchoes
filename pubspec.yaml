name: notechoes_app
description: "A new Flutter project."
publish_to: 'none'

version: 2.8.1+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # ── Existing dependencies (unchanged) ────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.20.3
  flutter_math_fork: ^0.7.4
  file_picker: ^11.0.3
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  speech_to_text: ^7.4.0
  record: ^7.1.1

  # ── AI infrastructure ─────────────────────────────────────────────────────
  # Drift: SQLite ORM for the AI job queue, transcript store, document chunks.
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.29
  sqlite3: ^3.5.1
  flutter_onnxruntime: ^1.8.3
  dart_sentencepiece_tokenizer: ^1.3.2
  path: ^1.9.0

  # Networking: resumable model downloads.
  http: ^1.4.0
  dio: ^5.8.0+1

  # Cryptography: SHA-256 model verification and source hashing.
  crypto: ^3.0.6

  # UUID: stable IDs for jobs, segments, chunks.
  uuid: ^4.5.1

  # PDF processing.
  pdfrx: ^1.0.88

  # Permissions: microphone, calendar, contacts.
  permission_handler: ^11.4.0

  # Secure storage: API keys / sensitive config if needed.
  flutter_secure_storage: ^9.2.4

  # Background jobs (Android WorkManager / iOS BGAppRefresh).
  workmanager: ^0.5.2

  # Timezone support for reliable date resolution.
  timezone: ^0.10.0

  # Connectivity: Wi-Fi check before model downloads.
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Drift code generation.
  drift_dev: ^2.22.0
  build_runner: ^2.4.14

flutter:
  # CocoaPods keeps all iOS plugins aligned with this app's iOS 17 target.
  # The MLX Qwen packages remain managed directly by the Xcode project.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/images/
    - assets/ai/
